<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telvia Camino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Layout: Camino app shell (brand bar, dark icon sidebar, breadcrumb, cards), recreated from the original XD screens under the Telvia brand. Light-only product UI prototype. */
:root{
  color-scheme:light;
  --ink:#111111; --ink-2:#6B6B6B; --ink-3:#9A9A9A;
  --page:#F4F4F4; --surface:#FFFFFF; --zebra:#F5F5F5; --line:#E0E0E0; --line-2:#B3B3B3;
  --lime:#C8F542; --lime-hover:#B9E632;
  --side:#262626; --side-2:#3A3A3A;
  --link:#111111; --hint:#F2F2F2; --hint-ink:#111111;
  /* status: muted, all >= 6.5:1 on white; never colour alone (shape + label) */
  --ok:#2E6B00; --warn:#7A4E00; --err:#A4262C; --info:#4A4A4A;
  --ok-bg:#F1F6EC; --warn-bg:#F7F3EA; --err-bg:#F8EEEE;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --shadow:0 1px 4px rgba(0,0,0,.12);
  --hdr:56px; --sw:64px; --sw-cur:var(--sw);
  --acc:#2E6B00; --acc-h:#245500; --acc-bg:#EEF5E6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:400;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.i{width:18px;height:18px;flex:none;vertical-align:-4px}

/* brand bar */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;z-index:40}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:500}
.brand .wm{font-size:19px;font-weight:500;letter-spacing:-.01em}
.brand .appn{margin-left:8px;padding-left:16px;border-left:1px solid var(--line);font-size:15px;color:var(--ink-2)}
.apps{margin-left:auto;display:flex;gap:22px;font-size:14px;font-weight:500;align-self:stretch}
.apps button{background:none;border:0;padding:0 2px;border-bottom:3px solid transparent;color:var(--ink-2)}
.apps button.on{border-bottom-color:var(--ink);color:var(--ink)}

/* sidebar */
.side{position:fixed;top:var(--hdr);bottom:0;left:0;width:var(--sw);background:var(--side);z-index:35;display:flex;flex-direction:column;transition:width .2s}
body.side-open{--sw-cur:232px}
body.side-open .side{width:232px}
.side .applogo{height:66px;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:2px solid #fff;margin:0 8px;color:#fff}
.side .applogo .c{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none}
.side .applogo .c .i{width:24px;height:24px}
.side .applogo b{font-weight:500;white-space:nowrap;overflow:hidden}
.side .tog{position:absolute;top:80px;right:-12px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:var(--ink);color:#fff;display:grid;place-items:center;padding:0}
.side .tog .i{width:14px;height:14px;transition:transform .2s}
.side-open .side .tog .i{transform:rotate(180deg)}
.side nav{display:flex;flex-direction:column;gap:6px;padding:18px 0;flex:1;overflow:hidden}
.side .gap{height:40px;flex:none}
.side .grow{flex:1}
.side .sep{border-top:1px solid var(--side-2);margin:8px 0}
.si{position:relative;display:flex;align-items:center;gap:14px;height:44px;margin:0 14px;padding:0 4px;background:none;border:0;color:#fff;border-radius:6px;white-space:nowrap;text-align:left}
.si .ib{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;flex:none}
.si .ib .i{width:22px;height:22px}
.si span.l{font-size:14px;opacity:0;transition:opacity .15s}
.side-open .side .si span.l{opacity:1}
.si:hover .ib{background:var(--side-2)}
.si.on .ib{background:var(--lime);color:var(--ink)}
/* count badge: lime on the dark rail (12:1 with black text), ringed in the rail colour so it separates from the icon and from the lime active state */
.si .badge{position:absolute;top:-3px;left:26px;min-width:20px;height:20px;border-radius:99px;background:var(--lime);color:var(--ink);font-size:12px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--side);font-variant-numeric:tabular-nums}
.si.on .badge{background:#fff}
/* expanded rail: the count moves from the icon to the end of the row */
.si .cnt{display:none}
.side-open .side .si .badge{display:none}
.side-open .side .si .cnt{display:grid;position:static;margin-left:auto}

/* main */
main{margin-left:var(--sw-cur);transition:margin-left .2s;padding:calc(var(--hdr) + 20px) 24px 80px;min-height:100vh}
.crumbs{display:flex;gap:10px;align-items:center;font-size:13px;margin:0 0 18px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;font-size:13px}
.crumbs button:hover{text-decoration:underline}
.crumbs .i{width:12px;height:12px;color:var(--ink-2)}
.crumbs b{font-weight:600;color:var(--ink)}
.card{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);padding:22px 24px;position:relative;min-width:0}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.card-h h2{font-size:20px}
.card-h .r{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.more{width:32px;height:28px;border:0;background:none;border-radius:4px;display:grid;place-items:center;font-size:20px;line-height:1;letter-spacing:1px;padding-bottom:8px}
.more:hover{background:var(--zebra)}
.row{display:grid;gap:20px;margin-bottom:20px}
.r2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 24px}
.facts.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.f b{display:block;font-weight:600;font-size:15px}
.f span,.f div{font-size:15px}
.f.full{grid-column:1/-1}
.f{min-width:0;overflow-wrap:anywhere}
.f .link{text-align:left;display:inline}
.dotted{border-bottom:1px dotted var(--ink);cursor:help}
.link{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;font-weight:500;display:inline-flex;align-items:center;gap:4px;font-size:15px}
.link .i{width:14px;height:14px}
.link:hover{text-decoration-thickness:2px}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* buttons */
.btn{height:42px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:4px;padding:0 24px;font-size:16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--zebra)}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-p:hover{background:var(--acc-h);border-color:var(--acc-h)}
.btn-block{width:100%}
.btn-sm{height:36px;padding:0 16px;font-size:15px}
.btn:disabled{background:#EDEDED;border-color:#EDEDED;color:#6B6B6B;cursor:not-allowed}
.ibtn{width:30px;height:30px;border:1px solid var(--ink);border-radius:4px;background:var(--surface);display:grid;place-items:center;padding:0;position:relative}
.ibtn .i{width:18px;height:18px}
.ibtn:hover{background:var(--zebra)}
.ibtn .rd{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--err)}
.split-btn{display:inline-flex;gap:6px}
.split-btn .btn:last-child{padding:0 10px}

/* form fields */
.fl{position:relative;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);min-width:220px;height:44px}
.fl label{position:absolute;left:12px;top:4px;font-size:11px;color:var(--ink-2);pointer-events:none}
.fl select,.fl input{appearance:none;-webkit-appearance:none;border:0;background:transparent;width:100%;height:100%;padding:16px 36px 2px 12px;font-size:15px;font-weight:500;outline:none}
.fl input{padding-right:12px;font-weight:400}
.fl .i{position:absolute;right:10px;top:13px;pointer-events:none}
.fl:focus-within{border-color:var(--ink)}
.fl.err{border-color:var(--err)}
.fl.ta{height:auto}
.fl.ta textarea{border:0;outline:none;width:100%;padding:20px 12px 8px;min-height:160px;resize:vertical;font-size:15px;line-height:1.5;background:transparent}
.ferr{color:var(--err);font-size:13px;margin-top:4px}
.search{display:flex;height:42px;border:1px solid var(--line-2);border-radius:4px;overflow:hidden;background:var(--surface);min-width:260px}
.search input{border:0;outline:none;flex:1;padding:0 12px;font-size:14px;min-width:0}
.search .clr{border:0;background:none;width:34px;display:grid;place-items:center;color:var(--ink-2)}
.search .go{border:0;border-left:1px solid var(--line-2);background:#E6E6E6;width:42px;display:grid;place-items:center}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden;height:42px;flex:none}
.seg button{border:0;border-right:1px solid var(--ink);background:var(--surface);padding:0 22px;font-size:15px;font-weight:500}
.seg button:last-child{border-right:0}
.seg button.on{background:#E3E3E3}
.toolbar{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.toolbar .r{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--ink);margin:0}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:600;padding:10px 14px;white-space:nowrap}
th .srt{display:inline-block;width:9px;margin-right:6px;font-size:10px;line-height:.6;vertical-align:1px}
tbody{border:1px solid var(--line)}
td{padding:12px 14px;vertical-align:middle}
tbody tr:nth-child(odd) td{background:var(--zebra)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#EAEAEA}
tbody tr.sel td{background:#DCDCDC!important}
tbody tr.child td:nth-child(2){padding-left:34px}
tbody tr.hl td{background:#EDEDED!important}
tbody tr.hl td:first-child{box-shadow:inset 4px 0 0 var(--ink)}
td.act{text-align:right;white-space:nowrap;width:1%}
td.act .ibtn{display:inline-grid;margin-left:6px}
.exp{width:26px;height:26px;border:0;background:none;display:grid;place-items:center;padding:0}
.exp .i{transition:transform .15s}
.exp.open .i{transform:rotate(90deg)}
.cf{display:flex;align-items:center;gap:6px}
.trunc{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ul{border-bottom:1px dotted var(--ink)}
.empty td{text-align:center;font-size:14px;font-weight:500;padding:34px}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;font-size:14px}
.pager .pg{width:24px;height:24px;border:0;background:none;display:grid;place-items:center;padding:0;color:var(--ink-2)}
.pager .pg.on{background:var(--ink);color:#fff;border-radius:3px;font-weight:600}
.pager .box{border:1px solid var(--line-2);border-radius:3px;width:26px;height:26px;display:grid;place-items:center}

/* status */
.st{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.sti{width:16px;height:16px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;line-height:1}
.sti.warn{width:18px;background:var(--warn);color:#fff;clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:4px;font-size:10px}
.sti.err{background:var(--err);color:#fff;border-radius:50%}
.sti.ok{color:var(--ok)}
.sti.ok .i,.sti.info .i{width:18px;height:18px}
.sti.info{color:var(--info)}
.sti.mute{color:var(--ink-3)}

/* hint */
.hint{background:var(--hint);padding:14px 16px;font-size:15px;color:var(--ink);border-radius:2px;border-left:4px solid var(--info)}
.hint b{font-weight:600}
.hint .acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.hint.warn{background:var(--warn-bg);border-left-color:var(--warn)}
.hint.err{background:var(--err-bg);border-left-color:var(--err)}
.hint.ok{background:var(--ok-bg);border-left-color:var(--ok)}
.next-hint{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.next-hint .t{flex:1;min-width:260px}
.next-hint .acts{margin-top:0}

/* dropzone */
.drop{border:1px dashed var(--ink);border-radius:4px;padding:18px;text-align:center;max-width:400px;margin:0 auto 18px;font-size:13px;background:none;width:100%;display:block}
.drop:hover{background:var(--zebra)}
.drop .i{width:28px;height:28px;margin-bottom:4px}
.drop b{display:block;font-weight:600}
.drop .lk{color:var(--link);text-decoration:underline;text-underline-offset:3px;font-weight:500;font-size:15px;display:block;margin:4px 0}

/* context menu */
.menu{position:absolute;z-index:45;background:var(--surface);box-shadow:0 4px 18px rgba(0,0,0,.18);border-radius:4px;min-width:240px;padding:6px 0}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 16px;font-size:15px}
.menu button:hover{background:var(--zebra)}
.menu button:disabled{color:var(--ink-3);cursor:default;background:none}

/* collapse handle */
.handle{display:flex;justify-content:center;margin:-10px 0 -8px;position:relative;z-index:2}
.handle button{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}

/* plan view */
.planwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start;position:relative}
.planwrap.wide{grid-template-columns:minmax(0,1fr)}
.planwrap.wide .vlist{display:none}
.viewer{padding:0;overflow:hidden}
.viewer .vh{display:flex;align-items:center;gap:14px;padding:16px 24px;flex-wrap:wrap}
.viewer .vh h2{font-size:20px}
.viewer .vh .fl{margin-left:auto;min-width:300px}
.canvas{position:relative;aspect-ratio:4/3;background:#4E6B3A}
.canvas svg.map{width:100%;height:100%;display:block}
.canvas .pgctl{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px}
.canvas .pgctl button{width:30px;height:30px;border:0;border-radius:3px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}
.canvas .pgctl button:disabled{opacity:.5}
.canvas .pgctl .box{background:#fff;border-radius:3px;padding:4px 10px;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.canvas .pgctl .box b{border:1px solid var(--line-2);border-radius:3px;padding:0 6px;font-weight:500}
.canvas .zoom{position:absolute;right:12px;bottom:14px;display:flex;gap:6px;align-items:center}
.canvas .zoom span{background:#fff;border-radius:3px;padding:4px 10px;font-size:13px;box-shadow:var(--shadow)}
.canvas .zoom button{width:28px;height:28px;border:0;background:#fff;border-radius:3px;box-shadow:var(--shadow);display:grid;place-items:center}
.collapse{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;z-index:3}
.planwrap.wide .collapse{left:12px;transform:translateY(-50%)}
.pin{cursor:pointer}
table.compact{font-size:14px}
table.compact th,table.compact td{padding:10px 8px}
table.compact tbody tr.child td:nth-child(2){padding-left:20px}
.addic{width:30px;height:30px;border:0;background:none;display:grid;place-items:center;padding:0}
.addic .i{width:22px;height:22px}

/* vorgang communication */
.comm{display:grid;grid-template-columns:minmax(0,38fr) minmax(0,62fr);gap:20px;align-items:stretch}
.comm .list{border:1px solid var(--line);min-height:420px}
.comm .list table tbody{border:0}
.pane{border:1px solid var(--line);min-height:420px;display:flex;flex-direction:column}
.pane .tabs{display:flex;background:var(--zebra);border-bottom:1px solid var(--line)}
.pane .tabs button{border:0;background:none;padding:10px 16px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center}
.pane .tabs button.on{background:var(--surface);box-shadow:inset 0 -2px 0 var(--ink)}
.pane .pb{padding:20px 24px;flex:1}
.pane .pb h3{font-size:18px;font-weight:600}
.pane .meta{display:grid;grid-template-columns:70px 1fr;gap:8px 12px;margin:16px 0;font-size:15px}
.pane .meta dt{color:var(--ink-2)}
.pane .meta dd{margin:0}
.pane .body{white-space:pre-line;font-size:15px}
.att{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.att span{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:3px;padding:4px 10px;font-size:13px}
.cic{position:relative;display:inline-grid;place-items:center;width:28px;height:24px}
.cic .i{width:22px;height:22px}
.cic i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:1.5px solid #fff}
.rem td{padding:11px 14px}
.rem .over{color:var(--err);font-weight:500}
.rem em{font-size:12px;color:var(--ink-2)}

/* overlay page */
.ov{position:fixed;top:var(--hdr);left:var(--sw-cur);transition:left .2s;right:0;bottom:0;background:var(--surface);z-index:30;display:flex;flex-direction:column;animation:fade .15s}
.ov-h{display:flex;align-items:center;padding:26px 30px 18px;border-bottom:1px solid var(--line)}
.ov-h h1{font-size:32px;font-weight:300}
.ov-h .x{margin-left:auto;width:40px;height:40px;border:0;background:none;display:grid;place-items:center}
.ov-h .x .i{width:24px;height:24px}
.ov-b{flex:1;overflow-y:auto;padding:28px 30px 40px}
.ov-b .col{max-width:820px}
.ov-f{border-top:1px solid var(--line);padding:16px 30px;display:flex;gap:20px;align-items:center}
.ov-f .l{font-size:15px}
.ov-f .acts{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap}
.ov-f > .btn-p{margin-left:4px}
.ov-f.left .acts{margin-left:40px}
.sec{margin-bottom:28px}
.sec h3{font-size:18px;font-weight:600;margin-bottom:4px}
.sec p.d{margin:0 0 14px;font-size:15px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fgrid .full{grid-column:1/-1}
.letter{border:1px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,.08);padding:40px 48px;max-width:720px;white-space:pre-line;font-size:14px;line-height:1.65}
.letter .lh{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:28px}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:4px;width:100%;max-width:620px;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal.wide{max-width:900px}
.modal .mh{display:flex;align-items:flex-start;gap:12px;padding:24px 28px 10px}
.modal .mh h2{font-size:24px;font-weight:300}
.modal .mh .x{margin-left:auto;width:36px;height:36px;border:0;background:none;display:grid;place-items:center}
.modal .mb{padding:10px 28px 20px;overflow-y:auto}
.modal .mf{display:flex;gap:14px;justify-content:flex-end;padding:16px 28px 24px;flex-wrap:wrap}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line-2);border-radius:4px;padding:12px 14px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.opt input{width:18px;height:18px;accent-color:var(--ink);margin:2px 0 0}
.opt b{display:block;font-weight:600}
.opt span{font-size:13px;color:var(--ink-2)}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--zebra)}
.spinner{width:18px;height:18px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-bottom:22px}
.kpi{border-left:2px solid var(--ink);padding:2px 16px}
.kpi .k{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.kpi .v{font-size:32px;font-weight:500;margin:4px 0 0;letter-spacing:-.02em}
.kpi .s{font-size:13px}
.kpi .s em{font-style:normal;font-weight:600}
.kpi .s .up{color:var(--warn)}
.kpi .s .dn{color:var(--ok)}
.news td:first-child{font-weight:500}
.quick{display:flex;gap:16px;flex-wrap:wrap}

/* toast */
.toasts{position:fixed;top:calc(var(--hdr) + 16px);right:24px;z-index:60;display:grid;gap:8px;width:min(420px,calc(100% - 32px))}
.toast{background:var(--surface);border-left:4px solid var(--ok);color:var(--ink);padding:14px 16px;font-size:15px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.15);animation:fade .2s}
.toast .i{color:var(--ok)}
.toast.info{border-left-color:var(--ink)}
.toast.info .i{color:var(--ink)}

/* prototype controls (not part of the product UI) */
body.shot .proto{display:none}
.proto{position:fixed;right:20px;bottom:20px;z-index:55;font-size:13px;transition:bottom .2s}
body.has-ov .proto{bottom:96px}
.proto > button{height:38px;border-radius:99px;border:0;background:var(--ink);color:#fff;padding:0 16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.proto > button .i{color:#fff;width:16px;height:16px}
.proto .pp{position:absolute;right:0;bottom:48px;width:280px;background:var(--ink);color:#fff;border-radius:10px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.proto .pp p{margin:0 0 10px;color:#BDBDBD;line-height:1.4}
.proto .pp b{color:#fff;font-weight:500}
.proto .pp .acts{display:grid;gap:6px}
.proto .pp button{height:32px;border-radius:6px;border:1px solid #555;background:none;color:#fff;font-size:13px;text-align:left;padding:0 10px}
.proto .pp button:hover{border-color:#fff}
.proto .pp button:disabled{opacity:.4;cursor:default}

.search.wide{width:100%;max-width:720px;height:48px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px}
.chip:hover{border-color:var(--ink)}
.bars{display:grid;gap:14px}
.bar{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:14px}
.bar .bt{height:12px;background:var(--zebra);border:1px solid var(--line);border-radius:2px;overflow:hidden;display:block}
.bar .bt i{display:block;height:100%;background:var(--ink)}
.bar b{text-align:right;font-weight:600}
.bar.mini{grid-template-columns:120px 48px;display:inline-grid}
.nlist{display:grid}
.nitem{display:flex;gap:14px;align-items:flex-start;padding:14px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.nitem:hover{background:var(--zebra)}
.nitem .t{flex:1;min-width:0;display:grid;gap:2px}
.nitem .t b{font-weight:500}
.nitem.unread .t b{font-weight:700}
.nitem.unread .t b::after{content:'Neu';margin-left:8px;font-size:11px;font-weight:600;border:1px solid var(--ink);border-radius:99px;padding:0 6px;vertical-align:1px}
details.faq{border-bottom:1px solid var(--line)}
details.faq summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:'+';font-weight:400;font-size:22px;line-height:1}
details.faq[open] summary::after{content:'–'}
details.faq p{margin:0 0 16px;max-width:760px}
.rearr{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.rr{display:flex;gap:16px;align-items:center;border:1px solid var(--line-2);border-radius:4px;padding:10px 12px}
.thumb{width:112px;aspect-ratio:4/3;border:1px solid var(--line);flex:none;overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.radios{display:flex;gap:28px;flex-wrap:wrap;margin-top:10px}
.canvas{overflow:auto}
body.reduce *,body.reduce *::before{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* responsive */
@media (max-width:1180px){
  .r3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .r3 > :last-child{grid-column:1/-1}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:16px}
  .planwrap,.comm{grid-template-columns:minmax(0,1fr)}
  .collapse{display:none}
}
@media (max-width:860px){
  .r2,.r3{grid-template-columns:minmax(0,1fr)}
  .r3 > :last-child{grid-column:auto}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){

  .hdr{padding:0 14px}

  .card{padding:18px 16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts,.facts.c2{grid-template-columns:minmax(0,1fr)}
  .fl,.search{min-width:0;flex:1 1 100%}

  .ov-h{padding:18px 16px 12px}
  .ov-h h1{font-size:24px}
  .ov-b{padding:20px 16px 30px}
  .ov-f{padding:12px 16px;flex-wrap:wrap}
  .ov-f .acts,.ov-f.left .acts{margin-left:0}
  .viewer .vh .fl{min-width:0;margin-left:0}
  .proto{right:12px;bottom:12px}
  .bar{grid-template-columns:minmax(0,1fr) 40px}
  .bar .bl{grid-column:1/-1}
  .rr{flex-wrap:wrap}
}

/* ---------- tasks (dashboard) ---------- */
function tasks(){
  const out = [];
  for (const v of S.vorgaenge){
    const p = P(v.pid); if (p.owner !== 'Max Mustermann' || p.closed) continue;
    const base = {v:v.id, sm:v.sm, pid:p.pid, onkz:p.onkz, grund:v.grund, desc:v.desc};
    if (v.status === 'reply') out.push({...base, tab:'vorgaenge', a:'Rücklauf bewerten', date:unrated(v).at, pri:0});
    if (v.reminder && new Date(v.reminder) <= now() && !FINAL.includes(v.status)) out.push({...base, tab:'erinnerungen', a:'Erinnerung (überfällig)', date:v.reminder, pri:1, over:true});
    if (v.status === 'sent' && CATS[v.cat].fiktion) out.push({...base, tab:'erinnerungen', a:'Zustimmungsfiktion', date:addDays(v.sentAt, CATS[v.cat].fiktion), pri:2});
    if (v.status === 'draft') out.push({...base, tab:'vorgaenge', a: v.cat==='priv' && !v.vertrag ? 'Vertragsart festlegen' : 'Kontakte zuweisen', date:null, pri:3});
    if (v.status === 'ready' || v.status === 'revise') out.push({...base, tab:'vorgaenge', a:'Antrag versenden', date:null, pri:3});
    if (v.status === 'clarify') out.push({...base, tab:'vorgaenge', a:'Nebenbestimmungen klären', date:null, pri:2});
    if (['approved','deemed'].includes(v.status)) out.push({...base, tab:'vorgaenge', a:'Weg sichern', date:null, pri:2});
    if (v.status === 'secured') out.push({...base, tab:'abschluesse', a:'Vorgang archivieren', date:null, pri:4});
  }
  for (const p of S.projects){ if (p.closed || p.owner!=='Max Mustermann') continue; const vs = vOf(p.id);
    if (vs.length && vs.every(v => FINAL.includes(v.status))) out.push({p:p.id, sm:p.sm.map(s=>s.nr), pid:p.pid, onkz:p.onkz, grund:'–', desc:p.desc, tab:'abschluesse', a:'Wesi abschließen', date:null, pri:1}); }
  return out.sort((a,b) => a.pri - b.pri);
}

/* ---------- Vorgang detail ---------- */
function nextHint(v){
  const c = CATS[v.cat], b = (a,l,p) => `<button class="btn btn-sm ${p?'btn-p':''}" data-act="${a}">${l}</button>`;
  if (v.printPending){ const m = v.comms.find(x => x.id===v.printPending);
    return ['warn', m.printed ? 'Der Brief wurde gedruckt. Quittieren Sie den Versand, sobald er zur Post gegeben wurde. Erst dann starten die Fristen.' : `Der Brief umfasst ${m.sheets} Blätter und kann nicht automatisch versendet werden. Drucken Sie ihn manuell und quittieren Sie anschließend den Versand.`, b('print','Manueller Druck', !m.printed) + b('quit','Manuellen Versand quittieren', m.printed)]; }
  switch (v.status){
    case 'draft': return v.cat==='priv' && !v.vertrag
      ? ['warn','Damit Sie am Vorgang Privatgrund fortfahren können, müssen Sie die Vertragsart festlegen.', b('vertrag','Vertragsart festlegen',1)]
      : ['','Bitte geben Sie die Kontakte an, mit denen Sie innerhalb dieses Vorgangs zusammenarbeiten und kommunizieren.', b('contacts','Kontakte hinzufügen',1)];
    case 'ready': return ['','Die Kontakte sind hinterlegt. Erstellen Sie das Anschreiben aus einer Vorlage. Die verknüpften Planseiten werden automatisch angehängt.', b('compose', v.cat==='priv'||S.ptype==='Brief'?'Brief versenden':'E-Mail senden',1)];
    case 'revise': return ['err','Durch die Bewertung „Überarbeitung erforderlich“ wurden vorhandene Fristen zurückgesetzt. Ergänzen Sie die Unterlagen und versenden Sie den Antrag erneut.', b('contacts','Kontakte bearbeiten')+b('compose','Erneut versenden',1)];
    case 'sent': { const el = daysBetween(v.sentAt, now());
      return ['', c.fiktion ? `Antrag versendet am ${fmt(v.sentAt)}. Liegt bis zum ${fmt(addDays(v.sentAt,c.fiktion))} keine Entscheidung vor, gilt die Zustimmung nach § 127 Abs. 3 TKG als erteilt.` : c.remind && el < 28 ? `Es sind noch keine 4 Wochen seit dem Versand vergangen. Diese Zeit wird Ver- und Entsorgern üblicherweise eingeräumt.` : `Antrag versendet am ${fmt(v.sentAt)}. Setzen Sie bei Bedarf eine Erinnerung.`, b('reminder','Erinnerung setzen')]; }
    case 'reply': return ['warn','Eine neue Nachricht ist eingegangen. Statusänderungen sind erst möglich, wenn alle eingehenden Nachrichten bewertet wurden.', b('rate','Rückläufer bewerten',1)];
    case 'clarify': return ['warn','Die Zustimmung enthält Nebenbestimmungen. Klären Sie diese mit dem Kontakt und dokumentieren Sie das Gespräch.', b('note','Gesprächsmitschrift')+b('clarified','Klärung abgeschlossen',1)];
    case 'approved': case 'deemed': return ['ok', v.status==='deemed' ? 'Die Frist nach § 127 Abs. 3 TKG ist ohne Entscheidung abgelaufen. Die Zustimmung gilt als erteilt.' : 'Die Zustimmung liegt vor. Bestätigen Sie, dass der Weg für den Bau gesichert ist.', b('secure','Weg gesichert',1)];
    case 'secured': return ['ok','Der Weg ist gesichert. Archivieren Sie Zustimmung und vertragsrelevante Dokumente in der VVGE.', b('archive','Vorgang archivieren',1)];
    default: return null;
  }
}

const eur = n => n == null || n === '' ? '–' : Number(n).toLocaleString('de-DE', {style:'currency', currency:'EUR'});
const iso = d => { d = new Date(d); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const qBox = (ph, k, cls='') => `<div class="search ${cls}"><input type="search" placeholder="${esc(ph)}" value="${esc(S.q[k]||'')}" data-act="q" data-k="${k}" aria-label="${esc(ph)}"><button class="clr" data-act="qClr" data-k="${k}" aria-label="Eingabe löschen">${ic('clear')}</button><button class="go" aria-label="Suchen">${ic('search')}</button></div>`;
const hit = (k, ...f) => { const q = (S.q[k]||'').trim().toLowerCase(); return !q || f.join(' ').toLowerCase().includes(q); };
const seg = (act, cur, opts) => `<div class="seg" role="tablist">${opts.map(([k,l]) => `<button role="tab" aria-selected="${cur===k}" class="${cur===k?'on':''}" data-act="${act}" data-v="${k}">${l}</button>`).join('')}</div>`;
const taskTable = ts => `<div class="tw"><table><thead><tr>${th('SM-Auftrag')}${th('Projekt-ID')}${th('ONKZ-ASB')}${th('Aufgabe')}${th('Antragsgrund')}${th('Beschreibung')}${th('Termine')}<th></th></tr></thead>
    <tbody>${ts.map(t => `<tr class="click" data-act="${t.v?'openV':'openP'}" data-id="${t.v||t.p}"><td class="num"><span class="ul">${t.sm[0]}</span>${t.sm.length>1?` <b>(+${t.sm.length-1})</b>`:''}</td><td class="num">${esc(t.pid)}</td><td class="num">${t.onkz}</td><td>${esc(t.a)}</td><td>${esc(t.grund)}</td><td><div class="trunc">${esc(t.desc)}</div></td><td class="num ${t.over?'rem':''}">${t.date?`<span class="${t.over?'over':''}">${fmt(t.date)}</span>`:'–'}</td><td class="act">${gear('task', t.v||t.p)}</td></tr>`).join('') || `<tr class="empty"><td colspan="8">Keine Aufgaben in dieser Ansicht.</td></tr>`}</tbody></table></div>`;
const NEWS = [

  {id:'n2', t:'Geplante Camino Downtime', d:'26.10.2026', x:'Am Samstag, 7. November, ist Camino zwischen 6 und 8 Uhr wegen Wartungsarbeiten nicht erreichbar. Geplante Briefe werden danach automatisch an den Druckdienstleister übergeben.'},

];
const FAQ = [
  ['Wann tritt die Zustimmungsfiktion ein?', 'Entscheidet der Wegebaulastträger nicht innerhalb von drei Monaten nach Eingang des vollständigen Antrags, gilt die Zustimmung nach § 127 Abs. 3 TKG als erteilt. Camino startet die Frist mit dem Versand und erinnert Sie vor Ablauf.'],

function notifs(){
  const out = [];
  for (const v of S.vorgaenge){ const p = P(v.pid); if (p.closed) continue;
    const m = unrated(v); if (m) out.push({id:'n-'+m.id, k:'warn', t:'Neuer Rückläufer', d:`${v.desc} · ${m.from}`, at:m.at, act:'openV', aid:v.id});
    if (v.reminder && new Date(v.reminder) <= now() && !FINAL.includes(v.status)) out.push({id:'r-'+v.id+'-'+iso(v.reminder), k:'err', t:'Erinnerung überfällig', d:v.desc, at:v.reminder, act:'openV', aid:v.id});
    if (v.status==='deemed') out.push({id:'d-'+v.id, k:'ok', t:'Zustimmungsfiktion eingetreten', d:v.desc, at:addDays(v.sentAt, CATS[v.cat].fiktion), act:'openV', aid:v.id});
    if (v.printPending) out.push({id:'p-'+v.printPending, k:'warn', t:'Brief wartet auf manuellen Druck', d:v.desc, at:v.comms.find(x=>x.id===v.printPending).at, act:'openV', aid:v.id});
  }
  for (const m of S.inbox) out.push({id:'i-'+m.id, k:'info', t:'Nachricht im allgemeinen Postkorb', d:m.subj, at:m.at, act:'nav', av:'inbox'});
  for (const z of S.payments) if (!z.paid && new Date(z.due) <= addDays(now(),14)) out.push({id:'z-'+z.id, k:'warn', t:'Zahlung bald fällig', d:`${z.nm} · ${z.amount?eur(z.amount):'Betrag offen'}`, at:z.due, act:'nav', av:'payments'});
  return out.sort((a,b) => new Date(b.at) - new Date(a.at));
}
const unreadN = () => notifs().filter(n => !S.readNotifs.includes(n.id)).length;

/* ---------- Search ---------- */
function vSearch(){
  const q = (S.q.g||'').trim(), on = q.length >= 2;
  const ps = on ? S.projects.filter(p => hit('g', p.pid, p.auftrag, p.desc, p.long, p.onkz)) : [];
  const sms = on ? S.projects.flatMap(p => p.sm.map(s => ({s, p}))).filter(({s}) => hit('g', s.nr, s.desc, s.onkz)) : [];
  const vs = on ? S.vorgaenge.filter(v => hit('g', v.desc, v.grund, CATS[v.cat].nm, v.sm.join(' '), P(v.pid).pid)) : [];
  const ks = on ? BOOK.filter(k => hit('g', k.org, k.dept, k.email, k.onkz, ...k.persons.map(x=>x.name))) : [];
  const total = ps.length + sms.length + vs.length + ks.length;
  const grp = (t, rows, head) => rows.length ? `<section class="card" style="margin-bottom:20px"><div class="card-h"><h2>${t} (${rows.length})</h2></div><div class="tw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div></section>` : '';
  return crumbs({l:'Suche'}) + `<section class="card" style="margin-bottom:20px"><div class="card-h"><h2>Camino durchsuchen</h2></div>
    ${qBox('Projekt-ID, SM-Auftrag, Vorgang oder Organisation', 'g', 'wide')}
    <div class="chips"><span class="small muted">Beispiele:</span>${['520aa','000123456794','Dorfstraße','Stadtwerke'].map(x => `<button class="chip" data-act="qSet" data-k="g" data-v="${x}">${x}</button>`).join('')}</div>
    <p class="small muted" style="margin:12px 0 0" role="status">${on ? `${total} Treffer für „${esc(q)}“` : 'Geben Sie mindestens 2 Zeichen ein.'}</p></section>
    ${grp('Projekte', ps.map(p => `<tr class="click" data-act="openP" data-id="${p.id}"><td class="num">${esc(p.pid)}</td><td>${esc(p.desc)}</td><td>${projStatus(p)}</td></tr>`), ['Projekt-ID','Beschreibung','Status'])}
    ${grp('SM-Aufträge', sms.map(({s,p}) => `<tr class="click" data-act="openPsm" data-id="${p.id}"><td class="num">${s.nr}</td><td class="num">${s.onkz}</td><td>${esc(s.desc)}</td><td class="num">${esc(p.pid)}</td></tr>`), ['SM-Auftrag','ONKZ-ASB','Beschreibung','Projekt-ID'])}
    ${grp('Vorgänge', vs.map(v => `<tr class="click" data-act="openV" data-id="${v.id}"><td>${CATS[v.cat].nm}</td><td>${esc(v.desc)}</td><td class="num">${esc(P(v.pid).pid)}</td><td>${vStat(v.status)}</td></tr>`), ['Kategorie','Beschreibung','Projekt-ID','Status'])}
    ${grp('Adressbuch', ks.map(k => `<tr class="click" data-act="orgInfo" data-id="${k.id}"><td>${esc(k.org)}</td><td>${esc(k.dept)}</td><td>${CATS[k.cat].nm}</td></tr>`), ['Organisation','Abteilung','Fachliche Zuständigkeit'])}
    ${on && !total ? `<section class="card"><p style="margin:0">Keine Treffer für „${esc(q)}“. Prüfen Sie die Schreibweise oder suchen Sie nach einer Projekt-ID.</p></section>` : ''}`;
}

/* ---------- Aufgaben ---------- */

  const all = tasks(), tab = S.ttab;

function renderLayer(){

function composeText(v, p){

/* ---------- generic form helpers ---------- */
const F = (id, d='') => S.layer?.f?.[id] ?? d;
function keepF(){ const l = S.layer; if (!l) return; l.f = l.f || {}; document.querySelectorAll('#layer input[id], #layer select[id], #layer textarea[id]').forEach(el => { l.f[el.id] = el.type==='checkbox' ? el.checked : el.value; }); }
const need = (l, rules) => { l.errs = {}; for (const [id, ok, msg] of rules) if (!ok) l.errs[id] = msg; return !Object.keys(l.errs).length; };
const fx = (id, label, o={}) => {
  const e = S.layer?.errs?.[id], v = F(id, o.v ?? ''), aria = e ? `aria-invalid="true" aria-describedby="${id}-e"` : '';
  const inner = o.opts ? `<select id="${id}" ${o.act?`data-act="${o.act}"`:''} ${aria}>${o.opts.map(x => { const [k,t] = Array.isArray(x) ? x : [x,x]; return `<option value="${esc(k)}" ${k===v?'selected':''}>${esc(t)}</option>`; }).join('')}</select>${ic('chevd')}`
    : o.ta ? `<textarea id="${id}" style="min-height:${o.ta}px" placeholder="${esc(o.ph||'')}" ${aria}>${esc(v)}</textarea>`
    : `<input id="${id}" type="${o.type||'text'}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" ${o.req?'aria-required="true"':''} ${aria}>`;
  return `<div class="${o.cls||''}"><div class="fl ${o.ta?'ta':''} ${e?'err':''}"><label for="${id}">${label}${o.req?'*':''}</label>${inner}</div>${e?`<div class="ferr" id="${id}-e">${esc(e)}</div>`:''}</div>`;
};
const reqFoot = (save, label='Speichern') => `<span class="small" style="margin-right:auto">* Pflichtfelder</span><button class="btn" data-act="closeLayer">Abbrechen</button><button class="btn btn-p" data-act="${save}">${label}</button>`;
const pageList = ps => { const s = [...ps].sort((a,b) => a-b), out = []; for (let i = 0; i < s.length; i++){ let j = i; while (j+1 < s.length && s[j+1] === s[j]+1) j++; out.push(j > i ? `${s[i]}-${s[j]}` : `${s[i]}`); i = j; } return out.join(', '); };
const sheetsOf = (attN, extra) => 2 + attN * 2 + (extra ? 62 : 0);

/* ---------- prototype controls ---------- */
function renderProto(){
  const v = S.view==='vorgang' ? V(S.vid) : null;
  const waiting = v && ['sent','revise'].includes(v.status) && v.sentAt;
  const c = v && CATS[v.cat];
  $('#proto').innerHTML = `<button data-act="protoTog" aria-expanded="${S.proto}">${ic('play')}Prototyp</button>${S.proto ? `<div class="pp"><p><b>Simulation</b> · heute ist der ${fmt(now())}. Rückmeldungen und Fristen lassen sich hier auslösen.</p><div class="acts">
    <button data-act="simReply" ${waiting?'':'disabled'}>Antwort des Kontakts trifft ein</button>
    <button data-act="simTime" data-v="28">4 Wochen vorspulen</button>
    <button data-act="simTime" data-v="${waiting && c.fiktion ? c.fiktion - daysBetween(v.sentAt, now()) + 1 : 0}" ${waiting && c.fiktion ? '' : 'disabled'}>Frist der Zustimmungsfiktion ablaufen lassen</button>
    <button data-act="reset">Prototyp zurücksetzen</button></div></div>` : ''}`;
}

  qSet(e, d){ S.q[d.k] = d.v; render(); },
  openPsm(e, d){ go({view:'project', pid:d.id, ptab:'sm', highlight:null}); },
  copy(e, d){ S.menu = null; renderMenu(); try { navigator.clipboard?.writeText(d.v); } catch(_){} toast(`„${d.v}“ wurde in die Zwischenablage kopiert`); },
  ttab(e, d){ S.ttab = d.v; render(); },
  ztab(e, d){ S.ztab = d.v; render(); },
  newsOpen(e, d){ go({view:'news', newsOpen:d.v}); },
  selIn(e, d){ S.selIn = d.id; render(); },
  inDone(e, d){ S.inbox = S.inbox.filter(m => m.id!==d.id); S.selIn = null; render(); toast('Nachricht wurde als erledigt markiert'); },
  inAssign(e, d){ openLayer({t:'inAssign', id:d.id, v:null}); },
  iaPick(e, d){ S.layer.v = d.v; renderLayer(); },
  iaSave(){
    const l = S.layer, m = S.inbox.find(x => x.id===l.id), v = V(l.v);
    const c = {id:'m'+(S.seq++), dir:'in', ch:'E-Mail', at:m.at, from:m.from, subj:m.subj, body:m.body, att:m.att};
    v.comms.push(c); v.status = 'reply'; log(v, 'Eingehende E-Mail', 'Manuell aus dem allgemeinen Postkorb zugeordnet.');
    S.inbox = S.inbox.filter(x => x.id!==m.id); S.selIn = null;
    go({view:'vorgang', vid:v.id, pid:v.pid, vtab:'komm', selMsg:c.id, paneTab:'emp'}); toast('Nachricht wurde dem Vorgang zugeordnet');
  },
  notif(e, d){ const n = notifs().find(x => x.id===d.id); if (!S.readNotifs.includes(n.id)) S.readNotifs.push(n.id); A[n.act](e, {id:n.aid, v:n.av}); },
  notifAll(){ S.readNotifs.push(...notifs().map(n => n.id)); render(); toast('Alle Benachrichtigungen als gelesen markiert'); },
  setTog(e, d){ S.settings[d.v] = e.target.checked; render(); toast('Einstellung wurde gespeichert'); },
  pfSave(){ S.settings.vertretung = val('pf-v'); S.settings.sig = val('pf-s'); toast('Profil wurde gespeichert'); },
  payMark(e, d){ const z = S.payments.find(x => x.id===d.id); openLayer({t:'pay', id:z.id, f:{'pa-a':z.amount ?? '', 'pa-d':iso(now()), 'pa-r':''}}); },
  paSave(){
    keepF(); const l = S.layer, f = l.f, z = S.payments.find(x => x.id===l.id);
    if (!need(l, [['pa-a', +f['pa-a'] > 0, 'Bitte geben Sie den gezahlten Betrag an.'], ['pa-d', f['pa-d'] && f['pa-d'] <= iso(now()), 'Das Zahlungsdatum darf nicht in der Zukunft liegen.']])) return renderLayer();
    Object.assign(z, {paid:true, amount:+f['pa-a'], paidAt:new Date(f['pa-d']), ref:f['pa-r']});
    log(V(z.vid), 'Zahlung erfasst', `${z.nm}: ${eur(z.amount)} am ${fmt(z.paidAt)} bezahlt${z.ref ? ` (Ref. ${z.ref})` : ''}.`, true);
    closeLayer(); toast('Zahlung wurde erfasst');
  },

  /* address book */
  bkCat(e){ S.bk.cat = e.target.value; render(); },
  bkOnkz(e){ S.bk.onkz = e.target.value; render(); },
  orgInfo(e, d){ openLayer({t:'orgInfo', id:d.id}); },
  orgNew(){ openLayer({t:'orgForm', f:{'of-t':'wbl', 'of-ch':'E-Mail', 'of-o':'2594-1'}}); },
  orgNewSub(){ const v = V(S.vid), p = P(v.pid); openSub({t:'orgForm', f:{'of-t':v.cat, 'of-ch':v.cat==='priv'?'Brief':'E-Mail', 'of-o':p.sm.find(s => s.nr===v.sm[0]).onkz}}); },
  orgEdit(e, d){ const k = contact(d.id); openSub({t:'orgForm', id:k.id, f:{'of-n':k.org, 'of-d':k.dept, 'of-t':k.cat, 'of-ch':k.ch, 'of-o':k.onkz, 'of-e':k.email, 'of-p':k.postal, 'of-l':k.link}}); },
  ofCh(){ keepF(); renderLayer(); },
  ofSave(){
    keepF(); const l = S.layer, f = l.f, ch = f['of-ch'];
    if (!need(l, [['of-n', (f['of-n']||'').trim(), 'Bitte geben Sie den Organisationsnamen an.'], ['of-o', /^\d{3,5}-\d$/.test((f['of-o']||'').trim()), 'Bitte geben Sie eine gültige ONKZ-ASB an, z. B. 2594-1.'],
      ch==='Brief' ? ['of-p', (f['of-p']||'').trim(), 'Bitte geben Sie die Postanschrift an.'] : ['of-e', /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test((f['of-e']||'').trim()), 'Bitte geben Sie eine gültige E-Mail-Adresse an.']])) return renderLayer();
    const data = {org:f['of-n'].trim(), dept:(f['of-d']||'').trim(), cat:f['of-t'], ch, onkz:f['of-o'].trim(), email:ch==='E-Mail' ? f['of-e'].trim() : '', postal:ch==='Brief' ? f['of-p'].trim() : '', link:(f['of-l']||'').trim()};
    let k; if (l.id){ k = contact(l.id); Object.assign(k, data); } else { k = {id:'c'+(S.seq++), persons:[], ...data}; BOOK.push(k); }
    const prev = l.prev, v = S.vid && V(S.vid);
    if (prev?.t==='contacts' && k.cat===v.cat){ prev.sel.push(k.id); prev.all = prev.all || k.onkz !== P(v.pid).sm.find(s => s.nr===v.sm[0]).onkz; }
    closeLayer(); toast(l.id ? 'Organisation wurde gespeichert' : 'Organisation wurde angelegt');
    if (!prev && !l.id) openLayer({t:'orgInfo', id:k.id});
  },
  psNew(e, d){ openSub({t:'person', id:d.id, f:{'ps-a':'Frau'}}); },
  psPub(e, d){ keepF(); S.layer.f['ps-pub'] = d.v; S.layer.errs && delete S.layer.errs['ps-pub']; renderLayer(); },
  psSave(){
    keepF(); const l = S.layer, f = l.f;
    if (!need(l, [['ps-pub', f['ps-pub'], 'Bitte beantworten Sie die Frage zur Datenherkunft.'], ['ps-n', (f['ps-n']||'').trim(), 'Bitte geben Sie den Namen an.']])) return renderLayer();
    contact(l.id).persons.push({anrede:f['ps-a'], name:f['ps-n'].trim(), fn:(f['ps-f']||'').trim(), tel:(f['ps-t']||'').trim(), pub:f['ps-pub']==='ja', at:now()});
    closeLayer(); toast(f['ps-pub']==='ja' ? 'Ansprechpartner wurde hinzugefügt' : 'Ansprechpartner wurde hinzugefügt · Datenschutzinformation wird versendet');
  },
  rvInfo(e, d){ openLayer({t:'frameInfo', id:d.id}); },
  rvNew(){ openLayer({t:'frameNew', f:{'rv-v':iso(addDays(now(), 3*365))}}); },
  rvFile(e, d){ keepF(); S.layer.f['rv-file'] = d.v; S.layer.errs && delete S.layer.errs['rv-file']; renderLayer(); },
  rvSave(){
    keepF(); const l = S.layer, f = l.f;
    if (!need(l, [['rv-file', f['rv-file'], 'Bitte laden Sie das Vertragsdokument hoch.'], ['rv-o', (f['rv-o']||'').trim(), 'Bitte geben Sie die örtliche Zuordnung an.'], ['rv-v', f['rv-v'] && f['rv-v'] > iso(now()), 'Das Ablaufdatum muss in der Zukunft liegen.']])) return renderLayer();
    S.frames.unshift({id:'r'+(S.seq++), name:f['rv-file'], ort:f['rv-o'].trim(), fach:f['rv-f'], org:f['rv-g'], valid:new Date(f['rv-v'])});
    closeLayer(); toast('Rahmenvertrag wurde hinzugefügt');
  },
  framesGo(){ S.layer = null; go({view:'frames'}); },

  /* project extras */
  projEdit(e, d){ S.menu = null; const p = P(d.id || S.pid); openLayer({t:'projEdit', id:p.id, f:{'pe-d':p.desc, 'pe-t':p.type, 'pe-z':p.pti, 'pe-o':p.owner, 'pe-l':p.long}}); },
  peSave(){
    keepF(); const l = S.layer, f = l.f, p = P(l.id);
    if (!need(l, [['pe-d', (f['pe-d']||'').trim(), 'Bitte geben Sie eine Kurzbeschreibung an.']])) return renderLayer();
    Object.assign(p, {desc:f['pe-d'].trim(), type:f['pe-t'], pti:f['pe-z'], owner:f['pe-o'], mail:f['pe-o']==='Max Mustermann' ? 'm.mustermann@telvia.example' : 'j.beispiel@telvia.example', long:f['pe-l']});
    closeLayer(); toast('Projekt wurde gespeichert');
  },
  projInfo(e, d){ openLayer({t:'projInfo', id:d.id || S.pid}); },
  baNew(){ const f = {'ba2-s':iso(addDays(now(), 30)), 'ba2-e':iso(addDays(now(), 150))}; if (S.layer?.t==='newVorgang'){ A.nvKeep(); openSub({t:'ba', f}); } else openLayer({t:'ba', f}); },
  baEdit(e, d){ const b = P(S.pid).ba.find(x => x.id===d.id), z = (b.ort.match(/^\d{5}/)||[''])[0]; openLayer({t:'ba', bid:b.id, f:{'ba2-n':b.name, 'ba2-z':z, 'ba2-o':b.ort.replace(z,'').trim(), 'ba2-s':b.start, 'ba2-e':b.end}}); },
  baSave(){
    keepF(); const l = S.layer, f = l.f, p = P(S.pid);
    if (!need(l, [['ba2-n', (f['ba2-n']||'').trim(), 'Bitte geben Sie die Lage der TK-Linie an.'], ['ba2-o', (f['ba2-o']||'').trim(), 'Bitte geben Sie den Ort an.'], ['ba2-s', f['ba2-s'], 'Bitte geben Sie den Baubeginn an.'], ['ba2-e', f['ba2-e'] && f['ba2-e'] >= f['ba2-s'], 'Das Bauende muss nach dem Baubeginn liegen.']])) return renderLayer();
    const data = {name:f['ba2-n'].trim(), ort:[f['ba2-z'], f['ba2-o']].filter(x => x && x.trim()).join(' '), start:f['ba2-s'], end:f['ba2-e']};
    let b; if (l.bid){ b = p.ba.find(x => x.id===l.bid); Object.assign(b, data); } else { b = {id:'b'+(S.seq++), ...data}; p.ba.push(b); }
    if (l.prev?.t==='newVorgang') l.prev.ba = b.id;
    closeLayer(); toast(l.bid ? 'Bauabschnitt wurde gespeichert' : 'Bauabschnitt wurde hinzugefügt');
  },
  smAdd(){ S.menu = null; openLayer({t:'smAdd', f:{}}); },
  smSave(){
    keepF(); const l = S.layer, f = l.f, p = P(S.pid), nr = (f['sm-n']||'').trim();
    if (!need(l, [['sm-n', /^002\d{9}$/.test(nr) && !p.sm.some(s => s.nr===nr), p.sm.some(s => s.nr===nr) ? 'Dieser SM-Auftrag ist dem Projekt bereits zugeordnet.' : 'Der SM-Auftrag muss mit „002“ beginnen und 12 Ziffern haben.']])) return renderLayer();
    p.sm.push({nr, onkz:f['sm-o'], desc:(f['sm-d']||'').trim() || 'Manuell hinzugefügt'}); closeLayer(); toast('SM-Auftrag wurde hinzugefügt');
  },

  /* plan extras */
  zoom(e, d){ S.zoom = Math.min(200, Math.max(100, S.zoom + +d.v)); render(); },
  rearr(e, d){ S.menu = null; const p = P(d.id && P(d.id) ? d.id : S.pid); S.pid = p.id; openLayer({t:'rearr', order:[...ord(p.plans[0])]}); },
  rrMove(e, d){ const o = S.layer.order, i = +d.v, j = i + +d.d; [o[i], o[j]] = [o[j], o[i]]; renderLayer(); setTimeout(() => document.querySelector(`#layer [data-act="rrMove"][data-v="${j}"][data-d="${d.d}"]:not(:disabled), #layer [data-act="rrMove"][data-v="${j}"]`)?.focus()); },
  rrSave(){
    const p = P(S.pid), pl = p.plans[0], old = ord(pl), nw = S.layer.order;
    for (const v of vOf(p.id)) v.pages = v.pages.map(pos => nw.indexOf(old[pos-1]) + 1).sort((a,b) => a-b);
    pl.order = [...nw]; pl.date = now(); closeLayer(); toast('Plandatei wurde neu arrangiert');
  },
  pages(e, d){ S.menu = null; if (d.id && V(d.id)) S.vid = d.id; const v = V(S.vid); if (!P(v.pid).plans.length) return toast('Laden Sie zuerst eine Plandatei im Projekt hoch.', true); openLayer({t:'pages', f:{'pg-i':pageList(v.pages)}}); },
  pgSave(){
    keepF(); const l = S.layer, v = V(S.vid), n = P(v.pid).plans[0].pages, raw = (l.f['pg-i']||'').trim(), out = new Set(); let bad = '';
    for (const part of raw ? raw.split(',') : []){ const t = part.trim(), m = t.match(/^(\d+)(?:\s*-\s*(\d+))?$/);
      if (!m){ bad = `„${t}“ ist keine gültige Seitenangabe.`; break; }
      const a = +m[1], b = m[2] ? +m[2] : a; if (a < 1 || b > n || a > b){ bad = `Die Plandatei hat nur die Seiten 1 bis ${n}.`; break; }
      for (let i = a; i <= b; i++) out.add(i); }
    if (!need(l, [['pg-i', !bad && out.size, bad || 'Bitte geben Sie mindestens eine Seite an oder lösen Sie alle Seiten vom Vorgang.']])) return renderLayer();
    v.pages = [...out].sort((a,b) => a-b); log(v, 'Planseiten zugewiesen', `Verknüpfte Seiten: ${pageList(v.pages)}.`); closeLayer(); toast('Planseitenzuweisung wurde gespeichert');
  },
  pgClear(){ const v = V(S.vid); v.pages = []; log(v, 'Planseiten zugewiesen', 'Alle Seiten vom Vorgang gelöst.'); closeLayer(); toast('Alle Seiten wurden vom Vorgang gelöst'); },

  /* vorgang extras */
  noteBy(e){ S.noteBy = e.target.value; render(); },
  noteNew(){ openLayer({t:'noteEdit', f:{}}); },
  noteEdit(e, d){ const n = V(S.vid).notes.find(x => x.id===d.id); openLayer({t:'noteEdit', nid:n.id, f:{'no-t':n.t}}); },
  noSave(){
    keepF(); const l = S.layer, v = V(S.vid), t = (l.f['no-t']||'').trim();
    if (!need(l, [['no-t', t, 'Bitte geben Sie eine Notiz ein.']])) return renderLayer();
    if (l.nid) Object.assign(v.notes.find(x => x.id===l.nid), {t, at:now()}); else v.notes.unshift({id:'n'+(S.seq++), at:now(), by:'m.mustermann@telvia.example', t});
    closeLayer(); toast(l.nid ? 'Notiz wurde gespeichert' : 'Notiz wurde hinzugefügt');
  },
  noteDel(e, d){ openLayer({t:'noteDel', nid:d.id}); },
  noDelOk(){ const v = V(S.vid); v.notes = v.notes.filter(x => x.id!==S.layer.nid); closeLayer(); toast('Notiz wurde gelöscht'); },
  vNotify(){ openLayer({t:'vNotify'}); },
  vnSave(){ const n = V(S.vid).notify; for (const k of ['in','rem','fik']) n[k] = document.getElementById(k).checked; closeLayer(); toast('Benachrichtigungen wurden gespeichert'); },
  remSet(){ openLayer({t:'remSet', f:{}}); },
  rsSave(){ Object.assign(S.settings, {daily:document.getElementById('rs-d').checked, time:val('rs-t'), scope:val('rs-r')}); closeLayer(); toast('Erinnerungseinstellung wurde gespeichert'); },
  cpExtra(){ A.cpKeep(); S.layer.extra = !S.layer.extra; renderLayer(); },
  print(){ openLayer({t:'print', f:{'pr-d':iso(addDays(now(), 2))}}); },
  prZip(){ keepF(); S.layer.zip = true; S.layer.errs && delete S.layer.errs.zip; renderLayer(); },
  prSave(){
    keepF(); const l = S.layer, v = V(S.vid), m = v.comms.find(x => x.id===v.printPending);
    if (!need(l, [['zip', l.zip, 'Bitte laden Sie die Dokumente zuerst herunter.'], ['pr-d', l.f['pr-d'] && l.f['pr-d'] >= iso(now()), 'Das Erinnerungsdatum darf nicht in der Vergangenheit liegen.']])) return renderLayer();
    m.printed = true; v.reminder = new Date(l.f['pr-d']); log(v, 'Manueller Druck', `Briefdokumente heruntergeladen. Erinnerung zum Quittieren am ${fmt(v.reminder)}.`, true);
    closeLayer(); toast('Erinnerung zum Quittieren wurde erstellt');
  },
  quit(){ openLayer({t:'quit', f:{'qt-d':iso(now())}}); },
  qtSave(){
    keepF(); const l = S.layer, v = V(S.vid), m = v.comms.find(x => x.id===v.printPending), d = l.f['qt-d'];
    if (!need(l, [['qt-d', d && d <= iso(now()) && d >= iso(m.at), 'Das Versanddatum muss zwischen Bereitstellung und heute liegen.']])) return renderLayer();
    m.quit = true; m.at = new Date(d); v.printPending = null; v.status = 'sent'; v.sentAt = new Date(d); v.reminder = null;
    log(v, 'Ausgehender Brief', `Manueller Versand am ${fmt(d)} quittiert.${CATS[v.cat].fiktion ? ' Frist der Zustimmungsfiktion gestartet (3 Monate).' : ''}`);
    closeLayer(); toast('Der Versand wurde quittiert');
  },

  /* filters */
  fMine(e){ S.filter.mine = e.target.value==='1'; render(); },
  fOpen(e){ S.filter.open = e.target.value==='1'; render(); },
  fQClr(){ S.filter.q = ''; render(); },
};
const CHANGE_ACTS = ['fMine','fOpen','ctAll','nvCat','onlyManual','bkCat','bkOnkz','ofCh','noteBy','setTog'];
const INPUT_CLICK_ACTS = ['npSm','nvSm','nvPage','ctSel','vtSel','bvSel','rtOpt','psPub','iaPick'];
document.addEventListener('click', e => {
  if (S.menu && !e.target.closest('.menu') && !e.target.closest('[data-act="menu"]')){ S.menu = null; renderMenu(); }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (CHANGE_ACTS.includes(act) || act==='fQ' || act==='q') return;
  if ((t.tagName==='INPUT' || t.tagName==='SELECT') && !INPUT_CLICK_ACTS.includes(act)) return;
  if (['expand','menu','newVorgang'].includes(act) || t.closest('td.act')) e.stopPropagation();
  A[act] && A[act](e, t.dataset, t);
}, true);
document.addEventListener('change', e => { const t = e.target.closest('[data-act]'); if (t && CHANGE_ACTS.includes(t.dataset.act)) A[t.dataset.act](e, t.dataset, t); });
document.addEventListener('input', e => {
  if (e.target.dataset.act === 'q'){
    const k = e.target.dataset.k, inLayer = !!e.target.closest('#layer'), pos = e.target.selectionStart;
    S.q[k] = e.target.value; if (inLayer){ keepF(); renderLayer(); } else render();
    const el = document.querySelector(`[data-act="q"][data-k="${k}"]`); if (el){ el.focus(); try { el.setSelectionRange(pos, pos); } catch(_){} }
    return;
  }
  if (e.target.dataset.act === 'fQ'){ S.filter.q = e.target.value; const pos = e.target.selectionStart; render(); const el = document.querySelector('[data-act="fQ"]'); el.focus(); el.setSelectionRange(pos, pos); }
});
/* deep links for case-study screenshots, e.g. #shot=vorgang */
const SHOT = new URLSearchParams(location.hash.slice(1)).get('shot');
if (SHOT) document.body.classList.add('shot');
if (SHOT === 'vorgang') Object.assign(S, {view:'vorgang', vid:'v101', pid:'p1'});
if (SHOT === 'plan') Object.assign(S, {view:'plan', pid:'p1', planPage:2, catOpen:{wbl:true, beh:true, kmb:true, ve:true, priv:true}});
if (SHOT === 'project') Object.assign(S, {view:'project', pid:'p1'});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (S.menu){ S.menu = null; renderMenu(); } else if (S.layer) closeLayer(); } });
render();
</script>
</body>
</html>

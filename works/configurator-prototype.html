<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telvia Configurator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
/* Layout: single-column checkout flow, 1040px column, sticky price bar. Deliberately light-only: it is a product UI prototype. */
:root{
  color-scheme:light;
  --ink:#111111; --ink-2:#6B6B6B; --ink-3:#9A9A9A;
  --page:#F6F6F6; --surface:#FFFFFF; --line:#E5E5E5; --line-2:#BDBDBD;
  --lime:#C8F542; --lime-hover:#B9E632; --stage:#F1F1EE;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r-card:10px; --r-btn:6px;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink)}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:96px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-weight:500;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}

/* header */
.hdr{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hdr .wrap{display:flex;align-items:center;gap:28px;height:64px;max-width:1200px}
.logo{display:flex;align-items:center;gap:8px;font-weight:500;font-size:18px;letter-spacing:-.01em}
.logo i{width:24px;height:24px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px}
.nav{display:flex;gap:22px;font-size:14px;color:#333}
.nav a{color:inherit;text-decoration:none}
.nav a:hover{color:var(--ink)}
.hdr-ic{margin-left:auto;display:flex;gap:6px}
.ic-btn{width:38px;height:38px;border:0;background:none;border-radius:8px;display:grid;place-items:center}
.ic-btn:hover{background:var(--page)}
.ic-btn svg{width:20px;height:20px}
.menu-btn{display:none}

/* stepper */
.stepper{display:flex;align-items:center;gap:10px;margin:28px 0 8px;font-size:13px;color:var(--ink-2);list-style:none;padding:0}
.stepper li{display:flex;align-items:center;gap:8px;white-space:nowrap}
.stepper .sep{flex:1;height:1px;background:#D6D6D6;min-width:12px}
.stepper .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:11px}
.stepper .on{background:var(--lime);color:var(--ink);padding:5px 12px 5px 5px;border-radius:99px;font-weight:500}
.stepper .on .n{background:var(--ink);border-color:var(--ink);color:#fff}
.stepper .done .n{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.step-mobile{display:none;font-size:13px;color:var(--ink-2);margin:20px 0 4px}
.step-mobile b{font-weight:500;color:var(--ink)}
.step-bar{height:4px;background:#E2E2E2;border-radius:99px;margin-top:8px;overflow:hidden}
.step-bar span{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}

.title{text-align:center;margin:36px 0 28px}
.title h1{font-size:38px;letter-spacing:-.03em}
.title p{margin:6px 0 0;color:var(--ink-2)}

/* tariff card */
.tariff{background:var(--ink);color:#fff;border-radius:14px;padding:22px 26px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.tariff .info{flex:1;min-width:200px}
.tariff h2{font-size:18px}
.tariff .sub{font-size:13px;color:#BDBDBD;margin-top:2px}
.tariff .eyebrow{font-size:12px;color:#BDBDBD;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.tariff .big{color:var(--lime)}
.tariff .mtl,.tariff .fine{color:#BDBDBD}
.tariff .btn{border-color:#fff;color:#fff}
.tariff .btn:hover{background:#2A2A2A}
.tariff :focus-visible{outline-color:var(--lime)}
.tariff .price{text-align:right}
.big{font-size:24px;font-weight:500;letter-spacing:-.02em}
.mtl{font-size:12px;color:var(--ink-2);font-weight:400}
.fine{font-size:12px;color:var(--ink-2)}
.tariff-details{flex-basis:100%;border-top:1px solid #333;padding-top:14px;font-size:13px;color:#BDBDBD;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 20px}
.tariff-details b{display:block;color:#fff;font-weight:500}

/* buttons */
.btn{border:1px solid var(--ink);background:transparent;border-radius:var(--r-btn);padding:9px 16px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn:hover{background:#F0F0F0}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--lime);border-color:var(--lime);font-weight:500}
.btn-primary:hover{background:var(--lime-hover);border-color:var(--lime-hover)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.btn-dark:hover{background:#333;border-color:#333}
.btn:disabled,.btn[aria-disabled="true"]{background:#E6E6E6;border-color:#E6E6E6;color:#767676;cursor:not-allowed;font-weight:400}
.sec-hint{font-size:13px;color:var(--ink-2);margin-right:auto}
.bar-toggle small.todo{color:var(--ink)}
.nudge{animation:ng .45s}
@keyframes ng{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.link-sm{font-size:13px;color:var(--ink);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}

/* accordion */
.acc{margin-top:20px;display:grid;gap:12px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 24px;transition:box-shadow .2s,opacity .2s}
.sec.open{box-shadow:0 1px 2px rgba(17,17,17,.04),0 8px 28px rgba(17,17,17,.06)}
.sec:not(.open):not(.done){opacity:.42;pointer-events:none}
.sec-h{width:100%;display:flex;align-items:center;gap:14px;padding:20px 0;background:none;border:0;text-align:left}
.sec-h .n{width:28px;height:28px;flex:none;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:13px;color:var(--ink-2)}
.sec.open .sec-h .n{background:var(--ink);border-color:var(--ink);color:#fff}
.sec.done .sec-h .n{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.sec-h .status{font-size:13px;color:var(--ink-2);white-space:nowrap}
.sec-done-h{display:flex;align-items:center;gap:14px;padding:20px 0 14px}
.sec-done-h .n{width:28px;height:28px;flex:none;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center}
.sec-done-h .n svg{width:18px;height:18px}
.sec-done-h h2{font-size:20px;flex:1;letter-spacing:-.01em}
.change{background:none;border:0;padding:4px 0;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.change svg{width:15px;height:15px}
.picked{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;gap:20px;align-items:stretch;margin-bottom:22px}
.picked .th{width:120px;flex:none;aspect-ratio:1;border-radius:10px;background:var(--stage);display:grid;place-items:center;overflow:hidden;color:#9A9A9A}
.picked .th img{width:100%;height:100%;object-fit:contain;transform:scale(1.25);filter:drop-shadow(0 6px 6px rgba(0,0,0,.15))}
.picked .th svg{width:40px;height:40px}
.picked .pi{flex:1;min-width:0;display:flex;flex-direction:column}
.picked .pi .nm{font-size:16px}
.picked .pi .nm b{font-weight:500}
.picked .pi .fine{margin-top:4px}
.picked .pi .pp{margin-top:auto;align-self:flex-end;text-align:right;padding-top:12px}
.picked.empty{color:var(--ink-2);font-size:14px;padding:14px 16px}
.kombi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:22px}
.kombi h3{font-size:18px;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px}
.chk input,.radios input{accent-color:var(--ink);width:18px;height:18px;margin:0}
.kombi .q{margin:18px 0 10px;font-size:14px;color:#333}
.radios{display:flex;flex-wrap:wrap;gap:12px 28px;font-size:14px}
.radios label{display:flex;align-items:center;gap:8px;cursor:pointer}
.benefits{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:6px;font-size:14px}
.benefits li{display:flex;gap:8px;align-items:center}
.benefits svg{width:16px;height:16px;flex:none;background:var(--lime);border-radius:50%;padding:2px}
.hint{margin-top:16px;font-size:14px;color:#444;background:#F4F4F4;border-radius:8px;padding:10px 12px}
.details-link{align-self:flex-start;background:none;border:0;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:3px;margin:0 0 12px;color:var(--ink)}
.modal-bg{position:fixed;inset:0;background:rgba(17,17,17,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:24px;position:relative}
.modal .x{position:absolute;top:12px;right:12px}
.modal .mimg{aspect-ratio:3/2;max-width:100%;background:var(--stage);border-radius:8px;overflow:hidden;margin-bottom:16px;display:grid;place-items:center;color:#9A9A9A}
.modal .mimg img{width:100%;height:100%;object-fit:contain}
.modal .mimg svg{width:56px;height:56px}
.modal h3{font-size:20px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:16px 0 0;font-size:14px}
.specs dt{color:var(--ink-2)}
.specs dd{margin:0}
.sec-h .n svg{width:18px;height:18px}
.n svg path{stroke-width:3.2}
.sec-h .t{flex:1;min-width:0}
.sec-wrap{margin:0;font-size:inherit;font-weight:inherit}
.sec-h .tt{font-size:20px;font-weight:500;letter-spacing:-.01em}
.sec-h .sum{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.sec-h .chev{width:20px;height:20px;color:var(--ink-2);transition:transform .2s}
.sec.open .sec-h .chev{transform:rotate(180deg)}
.sec-b{padding:0 0 24px}
.sec.done .picked{border:0;padding:0 0 22px;margin:0}
.sec.done .picked.empty{padding:0 0 22px 42px}
.sec-b>p{margin:0 0 18px;color:#333;max-width:65ch}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 16px 20px;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,box-shadow .2s,transform .2s}
.tile:hover{border-color:#BDBDBD;box-shadow:0 10px 30px rgba(17,17,17,.08)}
.tile.sel{border:2px solid var(--ink);padding:15px 15px 19px}
.badge{position:absolute;top:22px;left:22px;z-index:1;background:var(--lime);color:var(--ink);font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px}
.tile .img{aspect-ratio:3/2;max-width:100%;border-radius:8px;background:var(--stage);display:grid;place-items:center;overflow:hidden}
.tile .img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 14px rgba(0,0,0,.16));transition:transform .35s}
.tile:hover .img img{transform:scale(1.04)}
.tvv{width:100%;height:100%;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;container-type:inline-size}
.tvv .wm{display:flex;align-items:center;gap:8px;font-size:clamp(14px,9cqw,26px);font-weight:500;letter-spacing:-.02em}
.tvv .wm i{width:.62em;height:.62em;border-radius:50%;background:var(--lime)}
.tvv .tier{font-size:clamp(10px,4.5cqw,13px);color:var(--lime);letter-spacing:.08em;text-transform:uppercase}
.tile .img.ph{background:#F2F2F2;color:#9A9A9A}
.tile .img.ph svg{width:44px;height:44px}
.tile h3{font-size:18px;margin-top:16px;letter-spacing:-.01em}
.tile .desc{font-size:13px;color:#444;margin:6px 0 10px;flex:1}
.tile .feat{list-style:none;padding:0;margin:0 0 12px;font-size:13px;color:#444;display:grid;gap:4px}
.tile .feat li{display:flex;gap:6px;align-items:flex-start}
.tile .feat svg{width:14px;height:14px;flex:none;margin-top:3px}
.mode{display:flex;gap:18px;margin:4px 0 8px;font-size:14px}
.mode label{display:flex;align-items:center;gap:6px;cursor:pointer}
.mode input{accent-color:var(--ink);width:16px;height:16px;margin:0}
.tile .pr{margin:4px 0 14px}
.tile .pick{width:100%}
.tile.sel .pick{font-weight:500}

.sec-actions{display:flex;justify-content:flex-end;align-items:center;gap:20px;margin-top:20px;flex-wrap:wrap}

/* sticky bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;align-items:center;gap:28px;padding-top:14px;padding-bottom:14px}
.bar-toggle{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;flex:1;min-width:0}
.bar-toggle svg{width:18px;height:18px;transition:transform .2s;flex:none}
.bar.exp .bar-toggle svg{transform:rotate(180deg)}
.bar-toggle b{display:block;font-weight:500;font-size:16px}
.bar-toggle small{font-size:12px;color:var(--ink-2)}
.tot small{display:block;font-size:12px;color:var(--ink-2)}
.tot .v{font-size:22px;font-weight:500;letter-spacing:-.01em}
.flash{animation:fl .5s}
@keyframes fl{0%{background:var(--lime)}100%{background:transparent}}
.bar-detail{border-bottom:1px solid var(--line);max-height:50vh;overflow:auto}
.bar-detail .wrap{display:block;padding-top:16px;padding-bottom:16px}
.lines{display:grid;gap:8px;font-size:14px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:24px}
.line span:nth-child(2),.line span:nth-child(3){text-align:right;min-width:90px}
.line.head{font-size:12px;color:var(--ink-2)}
.line.sumrow{border-top:1px solid var(--line);padding-top:8px;font-weight:500}

/* cart view */
.cart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:24px;margin-top:8px}
.cart h2{font-size:20px;margin-bottom:16px}
.cart .lines{font-size:15px}
.cart-actions{display:flex;justify-content:space-between;gap:16px;margin-top:24px;flex-wrap:wrap}

.foot{margin:48px 0 24px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;font-size:12px;color:var(--ink-2)}
.note{margin-top:8px;text-align:center;font-size:12px;color:var(--ink-3)}

@media (max-width:860px){
  .nav{display:none}
  .menu-btn{display:grid}
  .stepper{display:none}
  .step-mobile{display:block}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  body{padding-bottom:140px}
  .title{margin:24px 0 20px}
  .title h1{font-size:26px}
  .tariff{padding:18px}
  .sec{padding:0 16px}
  .sec.done .picked.empty{padding-left:0}
  .tariff .price{text-align:left}
  .sec-h .tt,.sec-done-h h2{font-size:18px}
  .tiles{grid-template-columns:1fr}
  .picked{gap:14px;padding:12px}
  .picked .th{width:84px}
  .kombi{padding:16px}
  .sec-h .status{display:none}
  .sec-actions{justify-content:stretch;flex-direction:column-reverse;align-items:stretch;gap:14px}
  .sec-actions .btn{width:100%}
  .sec-actions .link{align-self:center}
  .sec-hint{margin:0;text-align:center}
  .bar .wrap{flex-wrap:wrap;gap:10px 20px;padding-top:10px;padding-bottom:12px}
  .bar-toggle{flex-basis:100%}
  .bar .tot .v{font-size:18px}
  .bar .btn-primary{margin-left:auto}
  .line{gap:12px}
  .line span:nth-child(2),.line span:nth-child(3){min-width:70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="hdr">
  <div class="wrap">
    <div class="logo"><i>t</i>telvia</div>
    <nav class="nav" aria-label="Hauptnavigation"><a href="#">Mobilfunk</a><a href="#">Internet</a><a href="#">TV</a><a href="#">Kombi-Pakete</a><a href="#">Glasfaser</a><a href="#">Service</a></nav>
    <div class="hdr-ic">
      <button class="ic-btn" aria-label="Suche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="ic-btn" aria-label="Warenkorb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h2l2.4 11h11L21 7H6"/><circle cx="9" cy="19.5" r="1.2"/><circle cx="18" cy="19.5" r="1.2"/></svg></button>
      <button class="ic-btn" aria-label="Konto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
      <button class="ic-btn menu-btn" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <ol class="stepper" id="stepper" aria-label="Bestellfortschritt"></ol>
  <div class="step-mobile" id="stepMobile"></div>
  <div id="view"></div>
  <div class="foot"><span>Impressum</span><span>Datenschutz</span><span>AGB</span><span>Produktinformationsblatt</span><span>Verbraucherinformationen</span><span>Kündigung</span></div>
  <p class="note">White-Label-Konzept · Produkte und Preise sind Beispiele</p>
</main>

<div class="bar" id="bar">
  <div class="bar-detail" id="barDetail" hidden><div class="wrap"><div class="lines" id="barLines"></div></div></div>
  <div class="wrap">
    <button class="bar-toggle" id="barToggle" aria-expanded="false" aria-controls="barDetail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 15 6-6 6 6"/></svg>
      <span><b>Ihre Auswahl</b><small id="barSub">inkl. MwSt. · Details anzeigen</small></span>
    </button>
    <div class="tot"><small>monatlich</small><span class="v num" id="totM">19,95 €</span></div>
    <div class="tot"><small>einmalig</small><span class="v num" id="totO">0,00 €</span></div>
    <button class="btn btn-primary" id="toCart" aria-describedby="barSub">Zum Warenkorb <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.4 11h11L21 7H6"/><circle cx="9" cy="19.5" r="1.2"/><circle cx="18" cy="19.5" r="1.2"/></svg></button>
  </div>
</div>

     specs:{'WLAN':'Wi-Fi 6 Mesh, bis 3 Gbit/s','Anschlüsse':'4× Gigabit-LAN, 1× WAN, 2× USB','Smart Home':'DECT ULE, Zigbee','Display':'Status- und Gastzugang-Anzeige'}},
    {id:'mesh', name:'Mesh Comfort', desc:'Router plus Repeater für ein stabiles Signal in allen Räumen.', feat:['Router Pro + 1 Repeater','Bis ca. 150 m²'], m:10.95, img:'mesh',
     specs:{'Lieferumfang':'Router Pro und 1 Repeater','WLAN':'Wi-Fi 6 Mesh','Reichweite':'bis ca. 150 m²','Einrichtung':'Automatische Kopplung per Taste'}}
   ]},
  {id:'wlan', title:'WLAN-Pakete', label:'Ihr WLAN-Paket', ship:true, skip:'Ohne WLAN-Paket fortfahren', skipSum:'Kein WLAN-Paket ausgewählt.',
   intro:'Erweitern Sie Ihr WLAN in schwer erreichbare Räume.',
   items:[
    {id:'ws', name:'WLAN-Paket S', desc:'Ein Repeater für eine zusätzliche Etage oder einen entfernten Raum.', feat:['1 Repeater','Wi-Fi 6'], m:3.95, img:'rep1',
     specs:{'Lieferumfang':'1 Repeater','WLAN':'Wi-Fi 6','Reichweite':'+ ca. 50 m²','Laufzeit':'monatlich kündbar'}},
    {id:'wm', name:'WLAN-Paket M', desc:'Ein Repeater mit Einrichtung vor Ort durch unseren Techniker.', feat:['1 Repeater','Installation vor Ort'], m:5.95, img:'rep1', badge:'Beliebt',
     specs:{'Lieferumfang':'1 Repeater','Service':'Einrichtung und WLAN-Messung vor Ort','Reichweite':'+ ca. 50 m²','Laufzeit':'monatlich kündbar'}},
    {id:'wl', name:'WLAN-Paket L', desc:'Zwei Repeater für Häuser mit mehreren Etagen.', feat:['2 Repeater','Installation vor Ort'], m:9.95, img:'rep2',
     specs:{'Lieferumfang':'2 Repeater','Service':'Einrichtung und WLAN-Messung vor Ort','Reichweite':'+ ca. 100 m²','Laufzeit':'monatlich kündbar'}}
   ]},
  {id:'tv', title:'TV', label:'Ihr TV-Paket', ship:false, skip:'Ohne TV fortfahren', skipSum:'Kein TV-Paket ausgewählt.',
   intro:'Fernsehen über Ihren Internetanschluss, live und auf Abruf.',
   items:[
    {id:'tvflex', name:'TV Flex', desc:'Über 50 Sender in HD in der App auf Smart-TV, Handy und Tablet.', feat:['Über 50 HD-Sender','24 Std. Cloud-Speicher','Monatlich kündbar'], m:10.00, visual:'Flex',
     specs:{'Sender':'über 50 in HD','Aufnahme':'24 Std. Cloud-Speicher','Geräte':'bis zu 3 gleichzeitig','Laufzeit':'monatlich kündbar'}},
    {id:'tvsmart', name:'TV Smart', desc:'Über 50 HD-Sender, Mediathek und ein Serien-Paket inklusive.', feat:['Über 50 HD-Sender','Serien-Paket inklusive','50 Std. Cloud-Speicher'], m:15.00, visual:'Smart', badge:'Empfohlen',
     specs:{'Sender':'über 50 in HD','Extras':'Serien-Paket inklusive','Aufnahme':'50 Std. Cloud-Speicher','Laufzeit':'24 Monate'}},
    {id:'tvsmartflex', name:'TV Smart Flex', desc:'TV, Filme und Serien mit Serien-Paket. Flexibel und monatlich kündbar.', feat:['Über 50 HD-Sender','Serien-Paket inklusive','Monatlich kündbar'], m:20.00, visual:'Smart Flex',
     specs:{'Sender':'über 50 in HD','Extras':'Serien-Paket inklusive','Aufnahme':'50 Std. Cloud-Speicher','Laufzeit':'monatlich kündbar'}}
   ]},
  {id:'stream', title:'Streaming-Geräte', label:'Ihr neues Gerät', ship:true, skip:'Ohne Streaming-Gerät fortfahren', skipSum:'Kein Streaming-Gerät ausgewählt.',
   intro:'Machen Sie jeden Fernseher mit HDMI zum Smart-TV.',
   items:[
    {id:'box', name:'TV Box', desc:'Leistungsstarker Receiver für das beste TV-Erlebnis.', feat:['4K HDR','Sprachfernbedienung'], m:5.00, buy:119.99, img:'tv',
     specs:{'Auflösung':'4K UHD, HDR10, Dolby Vision','Speicher':'16 GB','Anschlüsse':'HDMI 2.1, LAN, USB','Fernbedienung':'Bluetooth mit Sprachsteuerung'}},
    {id:'stick', name:'Streaming-Stick', desc:'Einfach per HDMI an den Fernseher anschließen und über WLAN streamen.', feat:['4K HDR','Für zuhause und unterwegs'], m:0, once:59.00, img:'stick',
     specs:{'Auflösung':'4K UHD, HDR10','Verbindung':'WLAN Wi-Fi 6','Anschluss':'HDMI, Strom per USB-C','Fernbedienung':'Bluetooth mit Sprachsteuerung'}}
   ]}
];

const state = { open:'router', done:{}, sel:{}, mode:{pro:'rent', box:'rent'}, view:'config', tariffOpen:false, barOpen:false, modal:null,
  kombi:{on:false, type:null} };
SECTIONS.forEach(s=>state.sel[s.id]=null);

const fmt = n => n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const sec = id => SECTIONS.find(s=>s.id===id);
const find = (sid,iid) => sec(sid).items.find(i=>i.id===iid);
const hasChoice = s => s.kombi ? (state.kombi.on && !!state.kombi.type) : !!state.sel[s.id];
const openSteps = () => SECTIONS.filter(s=>!state.done[s.id]);
const kombiActive = () => state.kombi.on && state.kombi.type==='postpaid';
function itemCost(it){
  if(it.buy && state.mode[it.id]==='buy') return {m:0,o:it.buy};
  return {m:it.m||0, o:it.once||0};
}
function modeLabel(it){ return it.buy ? (state.mode[it.id]==='buy'?' (Kauf)':' (Miete)') : ''; }
function lines(){
  const L=[{name:TARIFF.name+' (Monat 1–6)', m:TARIFF.m, o:0},{name:'Bereitstellung', m:0, o:0, zero:true}];
  SECTIONS.forEach(s=>{ if(s.kombi||!state.sel[s.id]) return;
    const it=find(s.id,state.sel[s.id]), c=itemCost(it); L.push({name:it.name+modeLabel(it), m:c.m, o:c.o}); });
  if(kombiActive()) L.push({name:'Kombi-Vorteil', m:-KOMBI_DISCOUNT, o:0});
  return L;
}
function totals(){ return lines().reduce((a,l)=>({m:a.m+l.m,o:a.o+l.o}),{m:0,o:0}); }
const priceText = n => (n<0?'− '+fmt(-n):fmt(n));

function priceHTML(it){
  const c=itemCost(it);
  if(c.o && !c.m) return `<span class="big num">${fmt(c.o)}</span> <span class="mtl">einmalig</span>`;
  return `<span class="big num">${fmt(c.m)}</span> <span class="mtl">mtl.</span>`;
}
function media(it){ if(it.visual) return `<div class="tvv"><span class="wm"><i></i>telvia tv</span><span class="tier">${it.visual}</span></div>`; return it.img ? `<img src="${IMG[it.img]}" alt="">` : ICON[it.icon]; }

function tileHTML(s,it){
  const sel = state.sel[s.id]===it.id;
  const mode = it.buy ? `<div class="mode" role="radiogroup" aria-label="Miete oder Kauf">
      <label><input type="radio" name="mode-${it.id}" id="mode-${it.id}-rent" value="rent" ${state.mode[it.id]!=='buy'?'checked':''}> Miete</label>
      <label><input type="radio" name="mode-${it.id}" id="mode-${it.id}-buy" value="buy" ${state.mode[it.id]==='buy'?'checked':''}> Kauf</label></div>`
    : `<div class="fine" style="margin-top:4px;margin-bottom:8px">${it.once?'Kauf':'Monatlich'}</div>`;
  return `<div class="tile ${sel?'sel':''}" data-s="${s.id}" data-i="${it.id}">
    ${it.badge?`<span class="badge">${it.badge}</span>`:''}
    <div class="img ${it.visual?'brand':''}">${media(it)}</div>
    <h3 id="n-${it.id}">${it.name}</h3>
    <p class="desc">${it.desc}</p>
    <button class="details-link" data-details="${s.id}:${it.id}">Gerätedetails</button>
    <ul class="feat">${it.feat.map(f=>`<li>${ICON.check}${f}</li>`).join('')}</ul>
    ${mode}
    <div class="pr">${priceHTML(it)}</div>
    <button class="btn pick" aria-pressed="${sel}" aria-describedby="n-${it.id}">${sel?ICON.check.replace('<svg','<svg aria-hidden="true"')+' Ausgewählt':'Auswählen'}</button>
  </div>`;
}

function pickedCard(s){
  if(s.kombi){
    if(!state.kombi.on) return `<div class="picked empty">Kein Kombi-Vorteil ausgewählt.</div>`;
    if(!kombiActive()) return `<div class="picked empty">${state.kombi.type==='prepaid'?'Prepaid-Tarif':'Business-Tarif'}: Für diesen Tarif gibt es keinen Kombi-Vorteil.</div>`;
    return `<div class="picked"><div class="th">${ICON.combo}</div><div class="pi">
      <div class="nm">Ihr Vorteil: <b>Kombi-Vorteil Mobilfunk</b></div>
      <div class="fine">5 € monatlich sparen · Doppeltes Datenvolumen · Flat in alle dt. Mobilfunknetze</div>
      <div class="pp"><span class="big num">− ${fmt(KOMBI_DISCOUNT)}</span> <span class="mtl">mtl.</span></div></div></div>`;
  }
  const id=state.sel[s.id];
  if(!id) return `<div class="picked empty">${s.skipSum}</div>`;
  const it=find(s.id,id);
  return `<div class="picked"><div class="th">${media(it)}</div><div class="pi">
    <div class="nm">${s.label}: <b>${it.name}${modeLabel(it)}</b></div>
    <div class="fine">${s.ship?'Lieferzeit: 1–4 Werktage':'Sofort nach Freischaltung nutzbar'}</div>
    <div class="pp">${priceHTML(it)}</div></div></div>`;
}

function kombiBody(){
  const k=state.kombi;
  return `<div class="kombi">
    <h3>Als Mobilfunkkunde mit Vorteilen sparen</h3>
    <label class="chk"><input type="checkbox" id="kombiOn" ${k.on?'checked':''}> Ich bin telvia Mobilfunkkunde</label>
    ${k.on?`<p class="q">Bitte wählen Sie Ihren aktuellen Mobilfunktarif.</p>
    <div class="radios" role="radiogroup" aria-label="Mobilfunktarif">
      ${[['postpaid','Mobilfunk-Tarif mit Laufzeit'],['prepaid','Prepaid-Tarif'],['business','Business-Tarif']].map(([v,t])=>
        `<label><input type="radio" name="kombiType" id="kombi-${v}" value="${v}" ${k.type===v?'checked':''}> ${t}</label>`).join('')}
    </div>
    ${k.type==='postpaid'
      ? `<ul class="benefits"><li>${ICON.check}5 € monatlich sparen</li><li>${ICON.check}Doppeltes Datenvolumen</li><li>${ICON.check}Flat vom Festnetz in alle dt. Mobilfunknetze</li></ul>`
      : `<p class="hint">Für ${k.type==='prepaid'?'Prepaid-Tarife':'Business-Tarife'} ist der Kombi-Vorteil nicht verfügbar. Sie können ohne Auswahl fortfahren.</p>`}`:''}
  </div>`;
}

function renderStepper(){
  const steps=['Produkt','Warenkorb','Kundendaten','Anschluss','Übersicht'];
  const cur = state.view==='config'?0:1;
  document.getElementById('stepper').innerHTML = steps.map((t,i)=>{
    const cls = i===cur?'on':(i<cur?'done':'');
    const n = i<cur?ICON.check.replace('<svg','<svg width="14" height="14"'):(i+1);
    return (i?'<li class="sep" aria-hidden="true"></li>':'')+`<li class="${cls}" ${i===cur?'aria-current="step"':''}><span class="n">${n}</span>${t}</li>`;
  }).join('');
  document.getElementById('stepMobile').innerHTML = `Schritt ${cur+1} von 5 · <b>${steps[cur]}</b><div class="step-bar"><span style="width:${(cur+1)*20}%"></span></div>`;
}

function sectionHTML(s,idx){
  const open = state.open===s.id, done=state.done[s.id];
  if(done && !open){
    return `<section class="sec done" id="sec-${s.id}">
      <div class="sec-done-h"><span class="n">${ICON.check}</span><h2>${s.title}</h2>
        <button class="change" data-open="${s.id}">Auswahl ändern ${ICON.pen}</button></div>
      ${pickedCard(s)}
    </section>`;
  }
  const status = s.kombi && kombiActive() ? '<span class="status">Vorteil gesichert</span>' : '';
  const isLast = idx===SECTIONS.length-1;
  return `<section class="sec ${open?'open':''}" id="sec-${s.id}">
    <h2 class="sec-wrap"><button class="sec-h" data-open="${s.id}" aria-expanded="${open}" aria-controls="body-${s.id}">
      <span class="n">${idx+1}</span><span class="t"><span class="tt">${s.title}</span></span>${status}${ICON.chev}
    </button></h2>
    ${open?`<div class="sec-b" id="body-${s.id}">
      ${s.kombi?`<p>Kombinieren Sie Festnetz und Mobilfunk und profitieren Sie von den Vorteilen.</p>${kombiBody()}`
        :`<p>${s.intro}</p><div class="tiles" role="group" aria-label="${s.title}">${s.items.map(it=>tileHTML(s,it)).join('')}</div>`}
      <div class="sec-actions">
        <button class="link" data-skip="${s.id}">${s.kombi?'Ohne Kombi-Vorteil fortfahren':s.skip}</button>
        <button class="btn btn-primary" data-next="${s.id}" ${hasChoice(s)?'':'disabled'}>Auswahl bestätigen ${ICON.arrow}</button>
      </div>
    </div>`:''}
  </section>`;
}

function renderConfig(){
  const t = state.tariffOpen;
  return `<div class="title"><h1>Ihre Produktauswahl</h1><p>Konfigurieren Sie Ihren Tarif und Ihre Geräte.</p></div>
  <section class="tariff" aria-label="Gewählter Tarif">
    <div class="info"><div class="eyebrow">Ihr Tarif</div><h2>${TARIFF.name}</h2><div class="sub">Internet-Flat mit bis zu 50 MBit/s Download und 10 MBit/s Upload</div></div>
    <div class="price"><div><span class="big num">${fmt(TARIFF.m)}</span> <span class="mtl">mtl.</span></div><div class="fine">ab Monat 7: 39,95 € mtl.</div></div>
    <button class="btn" id="tariffBtn" aria-expanded="${t}">Tarifdetails</button>
    ${t?`<div class="tariff-details"><div><b>Download</b>bis zu 50 MBit/s</div><div><b>Upload</b>bis zu 10 MBit/s</div><div><b>Telefonie</b>Flat ins deutsche Festnetz</div><div><b>Laufzeit</b>24 Monate</div></div>`:''}
  </section>
  <div class="acc">${SECTIONS.map(sectionHTML).join('')}</div>`;
}

function linesHTML(){
  const L=lines(), T=totals();
  return `<div class="line head"><span>Position</span><span>monatlich</span><span>einmalig</span></div>`+
   L.map(l=>`<div class="line"><span>${l.name}</span><span class="num">${l.m?priceText(l.m):'–'}</span><span class="num">${l.o?fmt(l.o):(l.zero?'0,00 €':'–')}</span></div>`).join('')+
   `<div class="line sumrow"><span>Summe</span><span class="num">${fmt(T.m)}</span><span class="num">${fmt(T.o)}</span></div>`;
}

function renderCart(){
  return `<div class="title"><h1>Ihr Warenkorb</h1><p>Prüfen Sie Ihre Auswahl, bevor Sie fortfahren.</p></div>
  <section class="cart"><h2>Übersicht</h2><div class="lines">${linesHTML()}</div>
  <p class="fine" style="margin-top:14px">Ab Monat 7 kostet ${TARIFF.name} 39,95 € mtl. Alle Preise inkl. MwSt.</p>
  <div class="cart-actions"><button class="link" id="backBtn">Zurück zur Produktauswahl</button><button class="btn" id="contBtn">Weiter zu Kundendaten ${ICON.arrow}</button></div></section>`;
}

function renderModal(){
  const host=document.getElementById('modalHost');
  if(!state.modal){ host.innerHTML=''; return; }
  const [sid,iid]=state.modal, it=find(sid,iid);
  host.innerHTML=`<div class="modal-bg" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="ic-btn x" data-close="1" aria-label="Schließen">${ICON.x}</button>
    <div class="mimg">${media(it)}</div>
    <h3 id="mTitle">${it.name}</h3><p class="fine" style="font-size:14px;margin:6px 0 0">${it.desc}</p>
    <dl class="specs">${Object.entries(it.specs).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap">
      <div>${priceHTML(it)}</div>
      <button class="btn" id="modalPick" data-s="${sid}" data-i="${iid}">${state.sel[sid]===iid?ICON.check+' Ausgewählt':'Auswählen'}</button></div>
  </div></div>`;
  host.querySelector('.x').focus();
}

let lastM=null, lastO=null;
function renderBar(){
  const T=totals();
  const m=document.getElementById('totM'), o=document.getElementById('totO');
  if(lastM!==null && lastM!==T.m){ m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash'); }
  if(lastO!==null && lastO!==T.o){ o.classList.remove('flash'); void o.offsetWidth; o.classList.add('flash'); }
  m.textContent=fmt(T.m); o.textContent=fmt(T.o); lastM=T.m; lastO=T.o;
  document.getElementById('barLines').innerHTML=linesHTML();
  document.getElementById('bar').classList.toggle('exp',state.barOpen);
  document.getElementById('barDetail').hidden=!state.barOpen;
  document.getElementById('barToggle').setAttribute('aria-expanded',state.barOpen);
  document.getElementById('toCart').hidden = state.view==='cart';
  const left=openSteps().length, sub=document.getElementById('barSub'), cart=document.getElementById('toCart');
  cart.setAttribute('aria-disabled', left>0);
  sub.classList.toggle('todo', left>0 && state.view==='config');
  sub.textContent = state.view==='cart' ? 'inkl. MwSt. · Details anzeigen'
    : left>0 ? `Noch ${left} von ${SECTIONS.length} Schritten offen` : 'Alles ausgewählt · inkl. MwSt.';
}

function render(focusSel){
  renderStepper();
  document.getElementById('view').innerHTML = state.view==='config'?renderConfig():renderCart();
  renderBar(); renderModal();
  if(focusSel && !state.modal){ const el=document.querySelector(focusSel); if(el) el.focus({preventScroll:true}); }
}

function scrollToSec(id){
  const el=document.getElementById('sec-'+id); if(!el) return;
  const y=el.getBoundingClientRect().top+window.scrollY-80;
  window.scrollTo({top:y,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function advance(sid){
  state.done[sid]=true;
  const idx=SECTIONS.findIndex(s=>s.id===sid);
  const next=SECTIONS.slice(idx+1).find(s=>!state.done[s.id]) || null;
  state.open = next?next.id:null;
  render(next?`[data-open="${next.id}"]`:null);
  scrollToSec(next?next.id:sid);
}
function toggleTile(sid,iid){
  state.sel[sid] = state.sel[sid]===iid?null:iid;
  render(`.tile[data-s="${sid}"][data-i="${iid}"] .pick`);
}

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-close]') && (t.closest('.x') || t.classList.contains('modal-bg'))){ const m=state.modal; state.modal=null; renderModal(); if(m){const b=document.querySelector(`[data-details="${m.join(':')}"]`); if(b) b.focus();} return; }
  if(t.closest('#modalPick')){ const b=t.closest('#modalPick'); state.sel[b.dataset.s]=b.dataset.i; state.modal=null; render(`.tile[data-i="${b.dataset.i}"] .pick`); return; }
  if(t.closest('.modal')) return;
  const det=t.closest('[data-details]'); if(det){ state.modal=det.dataset.details.split(':'); renderModal(); return; }
  if(t.closest('.mode')) return;
  const tile=t.closest('.tile'); if(tile){ toggleTile(tile.dataset.s,tile.dataset.i); return; }
  const oh=t.closest('[data-open]'); if(oh){ const id=oh.dataset.open; if(state.done[id]) state.done[id]=false; state.open = state.open===id?null:id; render(`[data-open="${id}"]`); if(state.open) scrollToSec(id); return; }
  const nx=t.closest('[data-next]'); if(nx){ if(nx.disabled) return; advance(nx.dataset.next); return; }
  const sk=t.closest('[data-skip]'); if(sk){ const s=sec(sk.dataset.skip); if(s.kombi){ state.kombi.on=false; state.kombi.type=null; } else state.sel[s.id]=null; advance(s.id); return; }
  if(t.closest('#tariffBtn')){ state.tariffOpen=!state.tariffOpen; render('#tariffBtn'); return; }
  if(t.closest('#barToggle')){ state.barOpen=!state.barOpen; renderBar(); return; }
  if(t.closest('#toCart')){
    const left=openSteps();
    if(left.length){ const c=t.closest('#toCart'); c.classList.remove('nudge'); void c.offsetWidth; c.classList.add('nudge');
      state.open=left[0].id; render(`[data-open="${left[0].id}"]`); scrollToSec(left[0].id); return; }
    state.view='cart'; state.barOpen=false; render('#backBtn'); window.scrollTo({top:0}); return; }
  if(t.closest('#backBtn')){ state.view='config'; render(); window.scrollTo({top:0}); return; }
  if(t.closest('#contBtn')){ const b=t.closest('#contBtn'); b.textContent='Ende des Prototyps'; b.disabled=true; return; }
});
document.addEventListener('change',e=>{
  const r=e.target;
  if(r.id==='kombiOn'){ state.kombi.on=r.checked; if(!r.checked) state.kombi.type=null; render('#kombiOn'); return; }
  if(r.name==='kombiType'){ state.kombi.type=r.value; render('#'+r.id); return; }
  if(r.name && r.name.startsWith('mode-')){
    const iid=r.name.slice(5); state.mode[iid]=r.value;
    const s=SECTIONS.find(x=>x.items && x.items.some(i=>i.id===iid)); state.sel[s.id]=iid;
    render('#'+r.id);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && state.modal){ const m=state.modal; state.modal=null; renderModal(); const d=document.querySelector(`[data-details="${m.join(':')}"]`); if(d) d.focus(); return; }
  if(e.key==='Tab' && state.modal){
    const f=[...document.querySelectorAll('.modal button')]; const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
  const tile=e.target.closest && e.target.closest('.tile');
  if(tile && e.target===tile && (e.key===' '||e.key==='Enter')){ e.preventDefault(); toggleTile(tile.dataset.s,tile.dataset.i); }
});
render();
</script>

</body>
</html>
